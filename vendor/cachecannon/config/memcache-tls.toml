# Memcache over TLS with a private CA and a client certificate.
#
# All certificate options are PEM:
#   tls_ca_file                -> CAs that verify the server
#   tls_cert_file/tls_key_file -> client certificate presented for mutual TLS
#
# Omit tls_cert_file/tls_key_file unless the server verifies client
# certificates. The private key must be unencrypted.

[general]
duration = "60s"
warmup = "10s"
threads = 4

[target]
endpoints = ["127.0.0.1:11212"]
protocol = "memcache-binary"  # or "memcache" for the ASCII protocol
tls = true

# SNI name to present. Needed when connecting by IP but the certificate is
# issued for a hostname.
tls_hostname = "cache.internal"

# CA bundle. Replaces the public CA roots: only these CAs are trusted.
tls_ca_file = "ca.pem"

# Client certificate. Both are required for mutual TLS.
tls_cert_file = "client.crt"
tls_key_file = "client.key"

[connection]
connections = 16
pipeline_depth = 32
connect_timeout = "5s"
request_timeout = "1s"

[workload.keyspace]
length = 16
count = 1000000
distribution = "uniform"

[workload.commands]
get = 80
set = 20

[workload.values]
length = 64
